<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKITZ SKATE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 18px;
  background: #101827;
  border-bottom: 2px solid #35e6ff;
}

h1 {
  margin: 0;
  color: #35e6ff;
  letter-spacing: 5px;
}

#stats {
  display: flex;
  justify-content: space-around;
  padding: 14px;
  font-weight: bold;
}

canvas {
  display: block;
  width: 100%;
  max-width: 1000px;
  margin: auto;
  background: #b5e6ff;
  touch-action: none;
}

#controls {
  padding: 18px 8px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

button {
  background: #152236;
  color: white;
  border: 1px solid #35e6ff;
  border-radius: 10px;
  padding: 15px 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: none;
}

button:active {
  background: #087c94;
}

#help {
  color: #aab8ca;
  padding: 0 15px 20px;
  font-size: 13px;
}
</style>
</head>

<body>
<header>
  <h1>SKITZ SKATE</h1>
  <p>YOUR CITY. YOUR STYLE. YOUR LINE.</p>
</header>

<div id="stats">
  <span>SCORE: <span id="score">0</span></span>
  <span>SPEED: <span id="speed">0</span></span>
  <span id="status">READY</span>
</div>

<canvas id="game" width="900" height="450"></canvas>

<div id="controls">
  <button id="left">◀ LEFT</button>
  <button id="right">RIGHT ▶</button>
  <button id="jump">OLLIE ↑</button>
  <button id="trick">360 FLIP ✦</button>
  <button id="restart">RESTART ↻</button>
</div>

<p id="help">
  Keyboard: A/D or ←/→ to skate · SPACE to jump · X to trick.
  Land safely to earn points!
</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreDisplay = document.getElementById("score");
const speedDisplay = document.getElementById("speed");
const statusDisplay = document.getElementById("status");

const keys = {};
let score = 0;
let speed = 0;
let camera = 0;
let airborne = false;
let jumpHeight = 0;
let jumpVelocity = 0;
let rotation = 0;
let trickActive = false;
let trickTimer = 0;
let lastTime = 0;
let gameOver = false;

const skater = {
  x: 180,
  y: 0,
  lane: 0
};

const obstacles = [
  {x: 650, type: "rail", passed: false},
  {x: 1050, type: "ramp", passed: false},
  {x: 1500, type: "rail", passed: false},
  {x: 2000, type: "ramp", passed: false},
  {x: 2600, type: "rail", passed: false}
];

function reset() {
  score = 0;
  speed = 0;
  camera = 0;
  jumpHeight = 0;
  jumpVelocity = 0;
  airborne = false;
  rotation = 0;
  trickActive = false;
  trickTimer = 0;
  gameOver = false;
  skater.x = 180;
  skater.lane = 0;

  obstacles.forEach(o => o.passed = false);

  statusDisplay.textContent = "READY";
}

function press(action) {
  if (gameOver) return;

  if (action === "left") skater.lane = Math.max(-1, skater.lane - 1);
  if (action === "right") skater.lane = Math.min(1, skater.lane + 1);

  if (action === "jump" && !airborne) {
    airborne = true;
    jumpVelocity = 10;
    trickActive = false;
    statusDisplay.textContent = "AIRBORNE!";
  }

  if (action === "trick" && airborne) {
    trickActive = true;
    trickTimer = 0;
    rotation += Math.PI * 2;
    statusDisplay.textContent = "TRICK!";
  }
}

document.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) {
    e.preventDefault();
  }

  if (keys[e.code]) return;
  keys[e.code] = true;

  if (e.code === "ArrowLeft" || e.code === "KeyA") press("left");
  if (e.code === "ArrowRight" || e.code === "KeyD") press("right");
  if (e.code === "Space" || e.code === "ArrowUp") press("jump");
  if (e.code === "KeyX") press("trick");
});

document.addEventListener("keyup", e => {
  keys[e.code] = false;
});

["left","right","jump","trick"].forEach(id => {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    press(id);
  });
});

document.getElementById("restart").addEventListener("click", reset);

function drawBackground() {
  const sky = ctx.createLinearGradient(0,0,0,450);
  sky.addColorStop(0,"#76c9f5");
  sky.addColorStop(1,"#e2f4ff");
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,900,450);

  // Sun
  ctx.fillStyle = "#fff1a8";
  ctx.beginPath();
  ctx.arc(750,75,35,0,Math.PI*2);
  ctx.fill();

  // City skyline
  for (let i = 0; i < 12; i++) {
    const x = ((i * 105 - camera * 0.18) % 1300 + 1300) % 1300 - 100;
    const h = 70 + (i * 37 % 100);

    ctx.fillStyle = i % 2 ? "#8da6b9" : "#6c879c";
    ctx.fillRect(x,190-h,75,h);

    ctx.fillStyle = "#d4edfa";

    for (let wy = 205-h; wy < 185; wy += 22) {
      for (let wx = x+12; wx < x+65; wx += 22) {
        ctx.fillRect(wx,wy,9,11);
      }
    }
  }

  // Park ground
  ctx.fillStyle = "#b5b8bf";
  ctx.fillRect(0,260,900,190);

  ctx.fillStyle = "#777e89";
  ctx.fillRect(0,285,900,165);

  // Ground markings
  ctx.strokeStyle = "#c5d0da";
  ctx.lineWidth = 3;
  ctx.setLineDash([30,25]);
  ctx.beginPath();
  ctx.moveTo(0,365);
  ctx.lineTo(900,365);
  ctx.stroke();
  ctx.setLineDash([]);

  // Park rail
  ctx.strokeStyle = "#e6edf5";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(520,320);
  ctx.lineTo(700,320);
  ctx.stroke();

  ctx.fillStyle = "#343d4a";
  ctx.fillRect(530,320,7,22);
  ctx.fillRect(685,320,7,22);
}

function drawObstacle(o) {
  const x = o.x - camera;
  if (x < -100 || x > 1000) return;

  if (o.type === "rail") {
    ctx.fillStyle = "#343b47";
    ctx.fillRect(x,305,12,40);
    ctx.fillRect(x+110,305,12,40);

    ctx.fillStyle = "#e8f4ff";
    ctx.fillRect(x-5,300,132,7);
  } else {
    ctx.fillStyle = "#18b6a4";
    ctx.beginPath();
    ctx.moveTo(x,345);
    ctx.lineTo(x+100,270);
    ctx.lineTo(x+170,345);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#d5fff6";
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

function drawSkater() {
  const groundY = 345 - jumpHeight;
  const laneY = skater.lane * 35;
  const x = skater.x;
  const y = groundY - laneY;

  ctx.save();
  ctx.translate(x,y-35);
  ctx.rotate(rotation);

  // Legs
  ctx.strokeStyle = "#182337";
  ctx.lineWidth = 10;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(-5,15);
  ctx.lineTo(-13,31);
  ctx.moveTo(7,15);
  ctx.lineTo(16,29);
  ctx.stroke();

  // Shoes
  ctx.fillStyle = "#f1f4fa";
  ctx.fillRect(-23,28,17,7);
  ctx.fillRect(8,27,18,7);

  // Shirt
  ctx.fillStyle = "#172b46";
  ctx.fillRect(-16,-15,32,34);

  // Arms
  ctx.strokeStyle = "#d99b72";
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-12,-8);
  ctx.lineTo(-28,5);
  ctx.moveTo(12,-8);
  ctx.lineTo(27,2);
  ctx.stroke();

  // Head
  ctx.fillStyle = "#b97d58";
  ctx.beginPath();
  ctx.arc(0,-28,13,0,Math.PI*2);
  ctx.fill();

  // Hair
  ctx.fillStyle = "#25232a";
  ctx.beginPath();
  ctx.arc(0,-33,13,Math.PI,Math.PI*2);
  ctx.fill();

  ctx.restore();

  // Skateboard
  ctx.fillStyle = "#25e6ff";
  ctx.fillRect(x-29,groundY+2,58,7);

  ctx.fillStyle = "#171b25";
  ctx.beginPath();
  ctx.arc(x-18,groundY+12,5,0,Math.PI*2);
  ctx.arc(x+18,groundY+12,5,0,Math.PI*2);
  ctx.fill();
}

function update(dt) {
  if (gameOver) return;

  speed = Math.min(8,speed+0.025*dt);
  camera += speed*dt*0.06;

  if (airborne) {
    jumpHeight += jumpVelocity*dt*0.07;
    jumpVelocity -= 0.35*dt;

    if (trickActive) {
      trickTimer += dt;

      if (trickTimer > 350) {
        trickActive = false;
      }
    }

    if (jumpHeight <= 0) {
      jumpHeight = 0;
      airborne = false;
      rotation = 0;

      if (trickActive) {
        score += 500;
        statusDisplay.textContent = "CLEAN LANDING! +500";
      } else {
        statusDisplay.textContent = "LANDED!";
      }

      trickActive = false;
    }
  }

  const worldX = camera + skater.x;

  obstacles.forEach(o => {
    if (!o.passed && worldX > o.x) {
      o.passed = true;

      if (jumpHeight < 25) {
        speed = 0;
        statusDisplay.textContent = "OBSTACLE HIT!";
      } else {
        score += 100;
        statusDisplay.textContent = "OBSTACLE CLEARED!";
      }
    }
  });

  score += Math.floor(speed*dt*0.02);

  scoreDisplay.textContent = score;
  speedDisplay.textContent = Math.round(speed*10);
}

function draw() {
  drawBackground();
  obstacles.forEach(drawObstacle);
  drawSkater();

  if (jumpHeight > 10) {
    ctx.fillStyle = "rgba(20,30,50,0.18)";
    ctx.beginPath();
    ctx.ellipse(skater.x,357,28,7,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = "#17263a";
  ctx.font = "bold 15px Arial";
  ctx.fillText("SKATE PARK 01",20,30);
}

function loop(time) {
  const dt = Math.min(time-lastTime || 16,32);
  lastTime = time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
