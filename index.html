<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKITZ SKATE</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}
canvas { display: block; }
#title {
  position: absolute;
  top: 20px;
  left: 20px;
  color: white;
  font-size: 28px;
  font-weight: bold;
  text-shadow: 2px 2px 5px black;
}
</style>
</head>
<body>
<div id="title">SKITZ SKATE 🛹</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  65, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, 9, 17);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 2));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(10, 20, 10);
sun.castShadow = true;
scene.add(sun);

function box(w, h, d, x, y, z, color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85 })
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// Concrete skate park
box(60, 1, 60, 0, -0.5, 0, 0x777b80);

// Skate ramps
box(12, 1, 5, -12, 0.5, -8, 0xaaaaaa);
box(8, 2, 5, 12, 1, -8, 0x999999);

// Ledges
box(8, 1, 2, -8, 0.5, 5, 0xcccccc);
box(8, 1.5, 2, 8, 0.75, 5, 0xcccccc);

// Grind rail
box(12, 0.15, 0.15, 0, 1.3, 0, 0x252a30);

// Skateboard
box(2.2, 0.18, 0.7, 0, 0.6, 8, 0x168cff);

// Simple skater placeholder
box(0.7, 1.8, 0.7, 0, 1.6, 8, 0x202030);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
